name: Emit Prisma contract artifacts

on:
  push:
    branches:
      - phase-4-step-4.2-payment-events

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run contract:emit --workspace=@task-marketplace/api

      - name: Commit generated contract artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/prisma/contract.json apps/api/src/prisma/contract.d.ts
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Phase 4 Step 4.2: emit Prisma contract artifacts"
          git push origin HEAD:phase-4-step-4.2-payment-events
